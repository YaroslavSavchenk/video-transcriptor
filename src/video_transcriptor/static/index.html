<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Transcriptor</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --side: #efede8; --text: #1c1b19; --muted: #6b6860; --border: #e3e0d8;
    --accent: #2f5bd3; --accent-text: #ffffff; --error-bg: #fdecea; --error: #a3261b;
    --chip: #eef1fb; --hover: #e6e3dc; --active: #dfe6fb; --ok: #1f7a4d; --mark: #fde68a; --mark-text: #1c1b19;
    --warn-bg: #fff6db; --warn: #7a5a00; --shadow: 0 10px 40px rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1e1c; --side: #1a1918; --text: #ecebe7; --muted: #9c998f; --border: #34322e;
      --accent: #7c9cff; --accent-text: #0d1020; --error-bg: #3a1d1a; --error: #ffb4a9;
      --chip: #262b3b; --hover: #262522; --active: #262f4d; --ok: #6fd3a0; --mark: #6b5513; --mark-text: #fff3c4;
      --warn-bg: #3a3014; --warn: #ffd978; --shadow: 0 10px 40px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: grid; grid-template-columns: 320px 1fr;
  }
  button { font: inherit; cursor: pointer; }
  mark { background: var(--mark); color: var(--mark-text); border-radius: 3px; padding: 0 1px; }

  /* ---- sidebar ---- */
  aside { background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; min-height: 0; }
  .side-head { display: flex; align-items: center; gap: 8px; padding: 16px 14px 10px; }
  .side-head h2 { font-size: .95rem; margin: 0; flex: 1; }
  .count { color: var(--muted); font-weight: 400; font-size: .85rem; }
  .search { margin: 0 12px 6px; position: relative; }
  .search input {
    width: 100%; font: inherit; font-size: .9rem; padding: 8px 30px 8px 32px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .search input::-webkit-search-cancel-button { display: none; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search .clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); padding: 4px 8px; display: none; }
  .search-info { color: var(--muted); font-size: .78rem; padding: 0 16px 4px; min-height: 1.2em; }
  #list { overflow-y: auto; flex: 1; padding: 0 8px 16px; }
  .group { position: sticky; top: 0; background: var(--side); color: var(--muted); font-size: .72rem; font-weight: 600;
           text-transform: uppercase; letter-spacing: .06em; padding: 10px 8px 4px; z-index: 1; }
  .item { width: 100%; text-align: left; background: transparent; color: var(--text); border: 0; border-radius: 8px; padding: 7px 10px; display: block; }
  .item:hover { background: var(--hover); }
  .item.active { background: var(--active); }
  .item .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .9rem; }
  .item .s { display: block; color: var(--muted); font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .snip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); font-size: .78rem; margin-top: 2px; }
  .empty { color: var(--muted); font-size: .85rem; padding: 10px; }
  #sentinel { height: 1px; }

  /* ---- main ---- */
  main { overflow-y: auto; height: 100vh; }
  .wrap { max-width: 840px; margin: 0 auto; padding: 32px 28px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .lead { color: var(--muted); margin: 0 0 22px; }
  form { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  .row { display: flex; gap: 10px; }
  input[type=url] { flex: 1; min-width: 0; font: inherit; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  input[type=url]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .primary { font-weight: 600; border: 0; border-radius: 10px; padding: 11px 18px; background: var(--accent); color: var(--accent-text); }
  .primary:disabled { opacity: .55; cursor: progress; }
  .ghost { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 9px; padding: 7px 12px; font-size: .88rem; }
  .ghost:hover { background: var(--hover); }
  .ghost.danger:hover { background: var(--error-bg); color: var(--error); }
  .icon-btn { border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 8px; padding: 5px 9px; font-size: .8rem; }
  .icon-btn:hover { background: var(--hover); }
  .options { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; color: var(--muted); font-size: .88rem; align-items: center; }
  .options label { display: flex; gap: 6px; align-items: center; }
  select { font: inherit; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .status { margin-top: 18px; color: var(--muted); display: none; align-items: center; gap: 10px; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .notice { margin-top: 18px; padding: 12px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); display: none; align-items: center; gap: 12px; flex-wrap: wrap; }
  .notice span { flex: 1; min-width: 200px; }
  .result { margin-top: 22px; display: none; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
  .meta h2 { font-size: 1.1rem; margin: 0; flex-basis: 100%; }
  .meta a { color: var(--accent); font-size: .85rem; flex-basis: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: .78rem; }
  .saved { color: var(--ok); font-size: .85rem; margin: 0 0 10px; display: none; }
  textarea { width: 100%; min-height: 320px; resize: vertical; font: inherit; line-height: 1.65; padding: 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .actions .spacer { flex: 1; }
  footer { margin-top: 36px; color: var(--muted); font-size: .78rem; word-break: break-all; }

  /* ---- dialog + toast ---- */
  dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; background: var(--panel); color: var(--text); width: min(520px, calc(100vw - 32px)); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg { padding: 22px 22px 18px; }
  .dlg .kind { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--error); margin-bottom: 6px; }
  .dlg h3 { margin: 0 0 8px; font-size: 1.15rem; }
  .dlg p { margin: 0 0 10px; white-space: pre-wrap; }
  .dlg .hint { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: .9rem; }
  .dlg details { margin-top: 10px; color: var(--muted); font-size: .8rem; }
  .dlg details pre { white-space: pre-wrap; word-break: break-word; font-family: Consolas, monospace; margin: 6px 0 0; max-height: 160px; overflow: auto; }
  .dlg .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); border-radius: 10px; padding: 10px 14px; display: none; gap: 14px; align-items: center; box-shadow: var(--shadow); z-index: 10; font-size: .9rem; max-width: calc(100vw - 32px); }
  .toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast button { background: none; border: 0; color: var(--bg); font-weight: 700; text-decoration: underline; }

  @media (max-width: 760px) {
    body { display: block; }
    aside { height: auto; max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--border); }
    main { height: auto; }
    .wrap { padding: 20px 16px 40px; }
    .row { flex-direction: column; }
  }
</style>
</head>
<body>
<aside>
  <div class="side-head">
    <h2>Transcripts <span class="count" id="count"></span></h2>
    <button class="icon-btn" id="open-folder" type="button" title="Open the folder with all transcripts">Open folder</button>
  </div>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search titles and text…  (Ctrl+K)" autocomplete="off" maxlength="200">
    <button class="clear" id="q-clear" type="button" title="Clear search">✕</button>
  </div>
  <div class="search-info" id="search-info"></div>
  <div id="list" role="list"><div id="sentinel"></div></div>
</aside>

<main>
  <div class="wrap">
    <h1>Video Transcriptor</h1>
    <p class="lead">Paste a link to an Instagram Reel, YouTube Short or TikTok (up to <span id="max">10</span> minutes).</p>

    <form id="form">
      <div class="row">
        <input id="url" type="url" required placeholder="https://www.instagram.com/reel/…" autocomplete="off" maxlength="2048" autofocus>
        <button class="primary" id="go" type="submit">Transcribe</button>
      </div>
      <div class="options">
        <label>Language
          <select id="language">
            <option value="en" selected>English</option>
            <option value="">Auto-detect</option>
            <option value="nl">Dutch</option>
            <option value="de">German</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
            <option value="uk">Ukrainian</option>
            <option value="ru">Russian</option>
          </select>
        </label>
        <label>Model <select id="model"></select></label>
        <label><input id="captions" type="checkbox" checked> Use platform captions when available</label>
      </div>
    </form>

    <div class="status" id="status"><div class="spinner"></div><span id="status-text">Working…</span></div>
    <div class="notice" id="existing">
      <span id="existing-text"></span>
      <button class="ghost" id="again" type="button">Transcribe again</button>
    </div>

    <section class="result" id="result">
      <div class="meta" id="meta"></div>
      <p class="saved" id="saved"></p>
      <textarea id="text" readonly></textarea>
      <div class="actions">
        <button class="ghost" id="copy" type="button">Copy</button>
        <button class="ghost" id="show-file" type="button">Show in folder</button>
        <button class="ghost" data-fmt="srt" type="button">Export .srt</button>
        <button class="ghost" data-fmt="vtt" type="button">Export .vtt</button>
        <span class="spacer"></span>
        <button class="ghost danger" id="delete" type="button">Delete</button>
      </div>
    </section>

    <footer>Runs on your own computer. Audio is fetched temporarily and deleted right after transcribing.
      Transcripts are saved in <span id="save-dir">the transcripts folder</span>.</footer>
  </div>
</main>

<dialog id="dialog">
  <div class="dlg">
    <div class="kind" id="dlg-kind"></div>
    <h3 id="dlg-title"></h3>
    <p id="dlg-message"></p>
    <p class="hint" id="dlg-hint"></p>
    <details id="dlg-details"><summary>Technical details</summary><pre id="dlg-tech"></pre></details>
    <div class="btns"><button class="primary" id="dlg-ok" type="button">OK</button></div>
  </div>
</dialog>
<div class="toast" id="toast"><span id="toast-text"></span><button id="toast-undo" type="button">Undo</button></div>

<script>
"use strict";
// All text from the server (titles, transcripts, errors) is inserted with textContent,
// never as HTML, so a video title or caption can't inject scripts into the app.
const $ = (id) => document.getElementById(id);
const PAGE = 50;
const MODEL_LABELS = {
  "small.en": "small.en · English, fast", "distil-large-v3": "distil-large-v3 · English, best",
  "tiny": "tiny · any language, fastest", "base": "base · any language", "small": "small · any language, fast",
  "medium": "medium · any language", "large-v3-turbo": "large-v3-turbo · any language, best",
  "large-v3": "large-v3 · any language, slow",
};
let englishOnly = [];
let current = null;  // transcript shown in the main area
const list = { q: "", offset: 0, total: 0, loading: false, lastGroup: null, token: 0 };

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const isWebLink = (s) => typeof s === "string" && /^https?:\/\//i.test(s);
function fmtDuration(s) { if (!s) return null; s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

async function api(path, options = {}) {
  let res;
  try {
    res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  } catch {
    throw { kind: "app", title: "The app isn't responding", message: "The transcription service stopped or is restarting.", hint: "Close Video Transcriptor and open it again." };
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = data.detail;
    if (d && typeof d === "object" && d.title) throw d;
    throw {
      kind: res.status >= 500 ? "app" : "link",
      title: res.status >= 500 ? "Something went wrong in the app" : "That didn't work",
      message: typeof d === "string" ? d : `The app answered with error ${res.status}.`,
      hint: res.status >= 500 ? "Try again. If it keeps happening, restart the app." : "",
    };
  }
  return data;
}

// ---------------------------------------------------------------- dialog + toast
const KIND_LABELS = { link: "Problem with the link", platform: "Problem on the platform's side", network: "Connection problem", video: "Problem with the video", app: "Problem in the app" };
function showError(err) {
  err = err || {};
  $("dlg-kind").textContent = KIND_LABELS[err.kind] || "Error";
  $("dlg-title").textContent = err.title || "Something went wrong";
  $("dlg-message").textContent = err.message || String(err.stack || err);
  $("dlg-hint").textContent = err.hint ? `What you can do: ${err.hint}` : "";
  $("dlg-hint").style.display = err.hint ? "" : "none";
  $("dlg-tech").textContent = err.technical || "";
  $("dlg-details").style.display = err.technical ? "" : "none";
  if (!$("dialog").open) $("dialog").showModal();
}
$("dlg-ok").addEventListener("click", () => $("dialog").close());

let toastTimer;
function toast(text, undo) {
  $("toast-text").textContent = text;
  $("toast-undo").style.display = undo ? "" : "none";
  $("toast-undo").onclick = async () => { $("toast").style.display = "none"; await undo(); };
  $("toast").style.display = "flex";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => ($("toast").style.display = "none"), 8000);
}

// ---------------------------------------------------------------- sidebar
function groupLabel(stamp) {
  const d = new Date(stamp.slice(0, 10) + "T00:00:00");
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((today - d) / 86400000);
  if (days <= 0) return "Today";
  if (days === 1) return "Yesterday";
  if (days < 7) return d.toLocaleDateString(undefined, { weekday: "long" });
  return d.toLocaleDateString(undefined, { month: "long", year: "numeric" });
}

function highlight(target, text, terms) {
  // Wrap matches in <mark> using DOM nodes only (never innerHTML).
  if (!terms.length) { target.textContent = text; return; }
  const re = new RegExp(`(${terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})`, "gi");
  text.split(re).forEach((part, i) => {
    if (part) target.append(i % 2 ? el("mark", null, part) : document.createTextNode(part));
  });
}

function renderItem(item, terms) {
  const btn = el("button", "item");
  btn.type = "button";
  btn.dataset.id = item.id;
  btn.title = item.title;
  const t = el("span", "t"); highlight(t, item.title, terms);
  const when = list.q ? item.transcribed.slice(0, 10) : item.transcribed.slice(11);
  btn.append(t, el("span", "s", [when, item.platform, item.channel].filter(Boolean).join(" · ")));
  if (item.snippet) { const s = el("span", "snip"); highlight(s, item.snippet, terms); btn.append(s); }
  btn.addEventListener("click", () => openSaved(item.id));
  return btn;
}

async function loadPage(reset) {
  const sentinel = $("sentinel");
  if (reset) {
    Object.assign(list, { offset: 0, total: 0, lastGroup: null, loading: false, token: list.token + 1 });
    $("list").replaceChildren(sentinel);
  } else if (list.loading || list.offset >= list.total) {
    return;
  }
  list.loading = true;
  const token = list.token;
  try {
    const params = new URLSearchParams({ q: list.q, offset: list.offset, limit: PAGE });
    const data = await api(`/api/transcripts?${params}`);
    if (token !== list.token) return;  // a newer search started meanwhile
    const terms = list.q.toLowerCase().split(/\s+/).filter(Boolean);
    const frag = document.createDocumentFragment();
    for (const item of data.items) {
      const g = list.q ? null : groupLabel(item.transcribed);
      if (g && g !== list.lastGroup) { frag.append(el("div", "group", g)); list.lastGroup = g; }
      frag.append(renderItem(item, terms));
    }
    if (!list.offset && !data.items.length) {
      frag.append(el("div", "empty", list.q ? "No transcripts match your search." : "Nothing yet. Your transcripts will show up here."));
    }
    $("list").insertBefore(frag, sentinel);
    list.offset += data.items.length;
    list.total = data.total;
    $("count").textContent = data.all ? `(${data.all.toLocaleString()})` : "";
    $("search-info").textContent = list.q ? `${data.total.toLocaleString()} result${data.total === 1 ? "" : "s"}` : "";
    markActive();
  } catch (err) {
    showError(err);
  } finally {
    if (token === list.token) list.loading = false;
  }
  // Keep filling while the list isn't scrollable yet.
  const box = $("list");
  if (token === list.token && list.offset < list.total && box.scrollHeight <= box.clientHeight + 300) loadPage(false);
}

new IntersectionObserver((entries) => { if (entries[0].isIntersecting) loadPage(false); },
                         { root: $("list"), rootMargin: "300px" }).observe($("sentinel"));

let searchTimer;
$("q").addEventListener("input", () => {
  $("q-clear").style.display = $("q").value ? "block" : "none";
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { list.q = $("q").value.trim(); loadPage(true); }, 200);
});
$("q-clear").addEventListener("click", () => { $("q").value = ""; $("q").dispatchEvent(new Event("input")); $("q").focus(); });
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("q").focus(); $("q").select(); }
});

function markActive() {
  document.querySelectorAll("#list .item").forEach(b => b.classList.toggle("active", !!current && b.dataset.id === current.id));
}

// ---------------------------------------------------------------- main view
function show({ id, title, link, chips, text, saved, files }) {
  current = { id, title, files };
  const meta = $("meta");
  meta.replaceChildren(el("h2", null, title || "Transcript"));
  if (isWebLink(link)) { const a = el("a", null, link); a.href = link; a.target = "_blank"; a.rel = "noopener noreferrer"; meta.append(a); }
  for (const c of chips) if (c) meta.append(el("span", "chip", c));
  $("saved").textContent = saved || "";
  $("saved").style.display = saved ? "block" : "none";
  $("text").value = text || "(No speech found.)";
  $("show-file").style.display = $("delete").style.display = id ? "" : "none";
  document.querySelectorAll("[data-fmt]").forEach(b => (b.style.display = files ? "" : "none"));
  $("result").style.display = "block";
  markActive();
}

async function openSaved(id, keepNotice) {
  try {
    const d = await api(`/api/transcript?${new URLSearchParams({ id })}`);
    if (!keepNotice) $("existing").style.display = "none";
    show({ id, title: d.title, link: d.link, text: d.text,
           chips: [d.transcribed && `Transcribed ${d.transcribed}`, d.platform, d.language && `Language: ${d.language}`, d.source] });
  } catch (err) { showError(err); }
}

async function transcribe(force) {
  const url = $("url").value.trim();
  if (!url) return;
  $("existing").style.display = "none";
  $("result").style.display = "none";
  $("status").style.display = "flex";
  $("go").disabled = true;
  const started = Date.now();
  const timer = setInterval(() => {
    $("status-text").textContent = `Working… ${Math.round((Date.now() - started) / 1000)}s (the first run downloads the model)`;
  }, 1000);
  try {
    const data = await api("/api/transcribe", {
      method: "POST",
      body: JSON.stringify({ url, language: $("language").value || null, model: $("model").value,
                             use_captions: $("captions").checked, force }),
    });
    if (data.existing) {
      $("existing-text").textContent = `You already transcribed this video on ${data.existing.transcribed.slice(0, 10)}. Here it is.`;
      $("existing").style.display = "flex";
      await openSaved(data.existing.id, true);
      return;
    }
    show({
      id: data.saved_id, link: data.url, text: data.text, files: data.files,
      title: data.saved_id ? data.saved_id.replace(/^\d{4}-\d{2}\/\d{4}-\d{2}-\d{2} - /, "").replace(/\.txt$/, "") : data.title,
      saved: data.saved_id ? "✓ Saved to your transcripts" : (data.save_error ? `Not saved: ${data.save_error}` : ""),
      chips: [
        data.source === "captions" ? "From platform captions" : `Speech recognition · ${data.extra.model}`,
        data.language && `Language: ${data.language}`,
        fmtDuration(data.duration) && `Length ${fmtDuration(data.duration)}`,
        `Took ${data.elapsed_seconds}s`,
      ],
    });
    $("url").value = "";
    loadPage(true);
  } catch (err) {
    showError(err);
  } finally {
    clearInterval(timer);
    $("status").style.display = "none";
    $("status-text").textContent = "Working…";
    $("go").disabled = false;
  }
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); transcribe(false); });
$("again").addEventListener("click", () => transcribe(true));

$("copy").addEventListener("click", async () => {
  await navigator.clipboard.writeText($("text").value);
  $("copy").textContent = "Copied ✓";
  setTimeout(() => ($("copy").textContent = "Copy"), 1500);
});

const openFolder = (id) => api("/api/open-folder", { method: "POST", body: JSON.stringify({ id: id || null }) }).catch(showError);
$("open-folder").addEventListener("click", () => openFolder());
$("show-file").addEventListener("click", () => current && openFolder(current.id));

$("delete").addEventListener("click", async () => {
  if (!current || !current.id) return;
  const { id, title } = current;
  try {
    await api(`/api/transcript?${new URLSearchParams({ id })}`, { method: "DELETE" });
    $("result").style.display = "none";
    $("existing").style.display = "none";
    current = null;
    loadPage(true);
    toast(`Deleted “${title}”`, async () => {
      try {
        const r = await api("/api/transcript/restore", { method: "POST", body: JSON.stringify({ id }) });
        await loadPage(true);
        openSaved(r.id);
      } catch (err) { showError(err); }
    });
  } catch (err) { showError(err); }
});

document.querySelectorAll("[data-fmt]").forEach(btn => btn.addEventListener("click", () => {
  if (!current || !current.files) return;
  const fmt = btn.dataset.fmt;
  const name = (current.title || "transcript").replace(/[<>:"/\\|?*\x00-\x1f]+/g, "").trim().slice(0, 80) || "transcript";
  const blob = new Blob([current.files[fmt]], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `${name}.${fmt}`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}));

// ---------------------------------------------------------------- start
$("language").addEventListener("change", () => {
  if ($("language").value !== "en" && englishOnly.includes($("model").value)) $("model").value = "large-v3-turbo";
});
$("model").addEventListener("change", () => { if (englishOnly.includes($("model").value)) $("language").value = "en"; });

api("/api/options").then(o => {
  $("max").textContent = o.max_minutes;
  $("save-dir").textContent = o.save_dir;
  englishOnly = o.english_only_models;
  for (const m of o.models) {
    const opt = new Option(MODEL_LABELS[m] || m, m);
    opt.selected = m === o.default_model;
    $("model").add(opt);
  }
}).catch(showError);
loadPage(true);
</script>
</body>
</html>
