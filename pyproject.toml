[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-transcriptor"
version = "0.1.0"
description = "Paste a link to a Reel, Short or TikTok and get a transcript. Runs locally and for free."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default]>=2025.11.12",
    "deno>=2.0",  # JavaScript runtime that yt-dlp needs for YouTube
    "faster-whisper>=1.1",
    "av<18",  # faster-whisper 1.2 uses an argument removed in PyAV 16
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# NVIDIA GPU support (Linux/Windows). CPU works fine without it.
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
video-transcriptor = "video_transcriptor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_transcriptor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
