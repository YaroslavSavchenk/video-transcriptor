name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, to catch newly published vulnerabilities

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra dev
      - name: Tests
        run: uv run pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check dependencies for known vulnerabilities
        run: |
          uv export --locked --all-extras --no-hashes --no-emit-project > requirements-audit.txt
          uvx pip-audit --strict --no-deps --disable-pip -r requirements-audit.txt
