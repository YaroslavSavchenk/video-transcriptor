# Keeps dependencies up to date. Security updates are opened as soon as an advisory appears;
# regular version updates are grouped weekly to keep the noise down.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # faster-whisper 1.2 uses av.open(metadata_errors=...), removed in PyAV 19.
      # Remove this rule once faster-whisper supports newer PyAV.
      - dependency-name: "av"
        versions: [">=19"]
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
